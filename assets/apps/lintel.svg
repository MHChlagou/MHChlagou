<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-labelledby="title">
<title id="title">Lintel: One Go binary that turns your Git hooks into a security checkpoint: secrets, SAST, SCA and lint behind one YAML spec.</title>
<defs>
  <linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></linearGradient>
  <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo" cx="0" cy="0" r="516" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3fb950" stop-opacity="0.12"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect x="0.5" y="0.5" width="859" height="199" rx="10"/></clipPath>
</defs>
<style>
.sans { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
</style>
<g clip-path="url(#card)">
  <rect width="860" height="200" fill="#0d1117"/>
  <rect width="860" height="200" fill="url(#halo)"/>
  <rect width="860" height="2" fill="url(#top)"/>
  <rect x="-160" y="0" width="160" height="200" fill="url(#sweep)" transform="skewX(-20)">
    <animate attributeName="x" values="-160;1020;1020" keyTimes="0;0.25;1" dur="8s" begin="0s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="0.5" y="0.5" width="859" height="199" rx="10" fill="none" stroke="#30363d"/>
<rect x="28" y="28" width="44" height="44" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.45"/><g transform="translate(28 28)" fill="none" stroke="#3fb950" color="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7 L34 12 V21 C34 29 28 35 22 37 C16 35 10 29 10 21 V12 Z"/><path d="M16 22 L20 26 L28 17"/></g>
<text x="88" y="50" class="sans" font-size="24" font-weight="700" fill="#e6edf3">Lintel</text>
<text x="88" y="70" class="mono" font-size="11" letter-spacing="1.5" fill="#3fb950">FEATURED · OPEN-SOURCE DEVSECOPS TOOL</text>
<text x="28" y="112" class="sans" font-size="15" fill="#8b949e">One Go binary that turns your Git hooks into a security</text><text x="28" y="133" class="sans" font-size="15" fill="#8b949e">checkpoint: secrets, SAST, SCA and lint behind one YAML spec.</text>
<rect x="28" y="156" width="31.2" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text x="43.6" y="171" class="mono" font-size="11" text-anchor="middle" fill="#c9d1d9">Go</text><rect x="67.2" y="156" width="70.8" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text x="102.6" y="171" class="mono" font-size="11" text-anchor="middle" fill="#c9d1d9">gitleaks</text><rect x="146.0" y="156" width="70.8" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text x="181.4" y="171" class="mono" font-size="11" text-anchor="middle" fill="#c9d1d9">opengrep</text><rect x="224.8" y="156" width="90.6" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text x="270.1" y="171" class="mono" font-size="11" text-anchor="middle" fill="#c9d1d9">osv-scanner</text><rect x="323.4" y="156" width="70.8" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text x="358.8" y="171" class="mono" font-size="11" text-anchor="middle" fill="#c9d1d9">Sigstore</text>
<g class="mono" font-size="11">
  <line x1="560" y1="92" x2="840" y2="92" stroke="#30363d" stroke-width="2" stroke-dasharray="3 6"/>
  <text x="560" y="76" fill="#8b949e">git commit</text>
  <text x="840" y="76" text-anchor="end" fill="#3fb950">✔ clean</text>
  <circle r="6" cy="92" fill="#d29922">
    <animate attributeName="cx" values="560;700;700;840;840" keyTimes="0;0.35;0.6;0.95;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#d29922;#3fb950" keyTimes="0;0.6" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(700 92)">
    <circle r="26" fill="#0d1117" stroke="#30363d" stroke-width="1.5">
      <animate attributeName="stroke" values="#30363d;#d29922;#3fb950;#30363d" keyTimes="0;0.35;0.6;0.95" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -15 L12 -10 V-1 C12 7 6 12 0 14 C-6 12 -12 7 -12 -1 V-10 Z" fill="none" stroke="#3fb950" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="700" y="140" text-anchor="middle" fill="#8b949e" opacity="0.5">pre-commit<animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.40;1" dur="4s" repeatCount="indefinite"/></text><text x="700" y="155" text-anchor="middle" fill="#8b949e" opacity="0.5">commit-msg<animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.46;1" dur="4s" repeatCount="indefinite"/></text><text x="700" y="170" text-anchor="middle" fill="#8b949e" opacity="0.5">pre-push<animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.52;1" dur="4s" repeatCount="indefinite"/></text>
</g>
