</g>
<rect x="0.5" y="0.5" width="423" height="183" rx="10" fill="none" stroke="#30363d"/>
<rect x="24" y="24" width="44" height="44" rx="10" fill="#f778ba" fill-opacity="0.1" stroke="#f778ba" stroke-opacity="0.45"/><g transform="translate(24 24)" fill="none" stroke="#f778ba" color="#f778ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11 H34 A3 3 0 0 1 37 14 V27 A3 3 0 0 1 34 30 H21 L14 36 V30 H10 A3 3 0 0 1 7 27 V14 A3 3 0 0 1 10 11 Z"/><path d="M22 16 V22 M22 25.5 V26"/><animate attributeName="opacity" values="1;1;0.2;1;0.4;1;1" keyTimes="0;0.8;0.82;0.84;0.86;0.88;1" dur="4s" repeatCount="indefinite"/></g>
