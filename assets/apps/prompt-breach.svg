  <radialGradient id="halo" cx="0" cy="0" r="254" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f778ba" stop-opacity="0.12"/><stop offset="1" stop-color="#f778ba" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect x="0.5" y="0.5" width="423" height="183" rx="10"/></clipPath>
</defs>
<style>
