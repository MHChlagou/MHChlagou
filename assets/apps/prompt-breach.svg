<text x="24" y="104" class="sans" font-size="13.5" fill="#8b949e">Cyberpunk prompt-injection simulator. Attack a bot</text><text x="24" y="123" class="sans" font-size="13.5" fill="#8b949e">as red team, then defend it as blue team.</text>
