<svg xmlns="http://www.w3.org/2000/svg" width="424" height="184" viewBox="0 0 424 184" role="img" aria-labelledby="title">
<title id="title">PROMPT//BREACH: Cyberpunk prompt-injection simulator. Attack a bot as red team, then defend it as blue team.</title>
<defs>
