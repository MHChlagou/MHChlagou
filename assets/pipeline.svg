<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190" role="img" aria-labelledby="title">
<title id="title">DevSecOps pipeline: plan, code, build, test, release, deploy, operate, monitor, each stage behind a security gate</title>
<defs>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.head { font-size: 12px; }
.num { font-size: 13px; font-weight: bold; }
.stage { font-size: 13px; font-weight: bold; }
.gate { font-size: 11px; }
</style>
<rect x="0.5" y="0.5" width="859" height="189" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="30" class="head" fill="#8b949e">// secure delivery pipeline</text>
<g>
