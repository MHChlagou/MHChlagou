    <animate attributeName="opacity" values="0;1" keyTimes="0;0.889" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
  </text>
</g>
<line x1="40" y1="96" x2="820" y2="96" stroke="#30363d" stroke-width="2" stroke-dasharray="4 8">
